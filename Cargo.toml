[workspace]
members = [
  "crates/dpg-model",
  "crates/dpg-rules",
  "crates/dpg-adapter",
  "crates/dpg-cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
[package]
name = "data-platform-guardrails-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = { package = "serde_yml", version = "0.0.12" }
serde_json = "1"
